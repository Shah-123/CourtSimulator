# `version:` is obsolete under Compose v2+ and only produces a warning.

services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: courtsim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-legal_case_sim}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host publishes use DOCKER_*_PORT, deliberately NOT the dev-workflow
      # variables. API_PORT is the Vite dev proxy target (README, vite.config.ts)
      # and PORT is the dev server's own port — binding the containers to those
      # makes `docker compose up` fail whenever `pnpm run dev:api` is running.
      # Defaults are offset by one so both stacks can run side by side.
      - "${DOCKER_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-legal_case_sim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Database Init / Migration & Statute Ingestion Runner
  # ==========================================
  # Reuses the api-server image, which is why that image keeps its workspace
  # node_modules, pnpm, scripts/ and data/ rather than shipping only the bundle.
  db-init:
    build:
      context: .
      dockerfile: ./artifacts/api-server/Dockerfile
    container_name: courtsim_db_init
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-legal_case_sim}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      MODEL_EMBEDDING: ${MODEL_EMBEDDING:-text-embedding-3-small}
    command: >
      sh -c "
        echo '==> Applying Drizzle DB Schema...' &&
        pnpm --filter @workspace/db run push &&
        echo '==> Seeding practice cases...' &&
        node ./scripts/seed.mjs &&
        echo '==> Ingesting and embedding Pakistani statute corpus...' &&
        node ./scripts/ingest-statutes.mjs &&
        echo '==> DB Setup complete!'
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. Python AI Reasoning & LangGraph Service
  # ==========================================
  ai-service:
    build:
      context: .
      dockerfile: ./artifacts/ai-service/Dockerfile
    container_name: courtsim_ai_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-legal_case_sim}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-llm}
      MODEL_TEXT: ${MODEL_TEXT:-gpt-4o}
      MODEL_EMBEDDING: ${MODEL_EMBEDDING:-text-embedding-3-small}
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Published for inspection only (/healthz, /docs at the viva). The browser
    # never calls this service — the SPA is same-origin against nginx, which
    # proxies only /api/ to Express.
    ports:
      - "${DOCKER_AI_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      # start_period covers the ~49s cold LangGraph import, which is lazy and so
      # happens on the first courtroom turn rather than at startup — but a cold
      # container under load should not be marked dead for taking it.
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. Express API Server
  # ==========================================
  api-server:
    build:
      context: .
      dockerfile: ./artifacts/api-server/Dockerfile
    container_name: courtsim_api_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-legal_case_sim}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      # No default by design: getSecret() throws lazily, so a stack without this
      # boots, serves /cases, and only fails at sign-in. Fail at `up` instead.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (32+ chars) in .env}
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 5000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MODEL_TEXT: ${MODEL_TEXT:-gpt-4o}
      MODEL_TTS: ${MODEL_TTS:-gpt-4o-mini-tts}
      MODEL_AUDIO: ${MODEL_AUDIO:-gpt-4o-audio-preview}
    depends_on:
      db-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${DOCKER_API_PORT:-5001}:5000"
    healthcheck:
      # node's global fetch rather than curl/wget: node:24-slim ships neither
      # reliably, and the runtime we do have is guaranteed to be there.
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 5. Web Frontend & Reverse Proxy
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: ./artifacts/adalat-ai/Dockerfile
    container_name: courtsim_frontend
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-80}:80"
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  pgdata:
