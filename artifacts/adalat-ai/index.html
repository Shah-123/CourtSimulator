    <!--
      Three roles, deliberately paired:
        Newsreader   — the spoken word in the record, and headings
        Archivo      — interface chrome
        Courier Prime — the typed apparatus: paragraph numbers, speaker
                        attributions, citations. Courier is the typewriter face
                        of the legal record, which is what this app produces.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&display=swap"
      rel="stylesheet"
    />
