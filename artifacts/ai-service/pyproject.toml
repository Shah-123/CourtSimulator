[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adalat-ai-service"
version = "0.1.0"
description = "Agentic reasoning, retrieval and evaluation service for Adalat AI"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.30",
    "openai>=1.50",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    # Optional: enables the local cross-encoder reranker. The service falls
    # back to LLM reranking if these are absent, so it stays deployable on
    # hosts where a torch install is impractical.
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]
eval = ["ragas>=0.2", "datasets>=3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
